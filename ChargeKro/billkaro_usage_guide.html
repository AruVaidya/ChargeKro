
<h2 class="sr-only">Step-by-step guide to using BillKaro GST Invoice Platform</h2>
<div style="padding: 1rem 0;">
  <div id="stepper" style="display:flex; gap:4px; margin-bottom:20px; flex-wrap:wrap;"></div>
  <div id="step-content"></div>
  <div style="display:flex; gap:8px; margin-top:16px;">
    <button id="prevBtn" onclick="go(-1)" style="padding:8px 20px; font-size:13px;">
      <i class="ti ti-arrow-left" aria-hidden="true" style="font-size:14px; margin-right:4px;"></i> Previous
    </button>
    <button id="nextBtn" onclick="go(1)" style="padding:8px 20px; font-size:13px;">
      Next <i class="ti ti-arrow-right" aria-hidden="true" style="font-size:14px; margin-left:4px;"></i>
    </button>
  </div>
</div>

<script>
const steps = [
  {
    title: "Choose your industry",
    icon: "ti-building-store",
    content: `
      <div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:1.25rem;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
          <i class="ti ti-building-store" aria-hidden="true" style="font-size:20px; color:var(--color-text-info);"></i>
          <span style="font-size:16px; font-weight:500;">Step 1 — Choose your industry</span>
        </div>
        <p style="font-size:14px; color:var(--color-text-secondary); line-height:1.7; margin-bottom:14px;">
          When you open BillKaro for the first time, you'll see a grid of 10 industry cards. Pick the one that matches your business. Each template comes pre-loaded with the correct SAC/HSN codes and GST rates, so you don't need to look anything up.
        </p>
        <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:14px;">
          ${[
            ["ti-barbell","Gym"],["ti-scissors","Salon"],["ti-tools-kitchen","Restaurant"],["ti-device-laptop","IT / Consulting"],["ti-pencil","Freelancer"],
            ["ti-shopping-cart","Retail"],["ti-heart-rate-monitor","Clinic"],["ti-book","Coaching"],["ti-home","Real estate"],["ti-settings","Custom"]
          ].map(([ic,lb],i) => `
            <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:10px 6px; text-align:center; ${i===0?'border:2px solid var(--color-border-info);':'border:0.5px solid var(--color-border-tertiary);'}">
              <i class="ti ${ic}" aria-hidden="true" style="font-size:18px; display:block; margin-bottom:4px; color:${i===0?'var(--color-text-info)':'var(--color-text-secondary)'};"></i>
              <span style="font-size:11px; color:var(--color-text-secondary);">${lb}</span>
            </div>
          `).join("")}
        </div>
        <div style="background:var(--color-background-info); border-radius:var(--border-radius-md); padding:10px 14px; font-size:13px; color:var(--color-text-info);">
          <i class="ti ti-bulb" aria-hidden="true" style="font-size:14px; margin-right:4px;"></i>
          Don't see your industry? Pick "Custom" and add your own services manually.
        </div>
      </div>`
  },
  {
    title: "Set up your business",
    icon: "ti-settings",
    content: `
      <div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:1.25rem;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
          <i class="ti ti-settings" aria-hidden="true" style="font-size:20px; color:var(--color-text-info);"></i>
          <span style="font-size:16px; font-weight:500;">Step 2 — Set up your business</span>
        </div>
        <p style="font-size:14px; color:var(--color-text-secondary); line-height:1.7; margin-bottom:14px;">
          Fill in your business details. These appear on every invoice you generate. You only need to do this once — BillKaro saves everything.
        </p>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          ${[
            ["ti-building","Business name & address","Your registered name and full address as per GST certificate"],
            ["ti-id","GSTIN number","Your 15-digit GST Identification Number (mandatory)"],
            ["ti-phone","Phone & email","Contact details printed on invoice"],
            ["ti-map-pin","State","Your state — used to auto-detect CGST+SGST vs IGST"],
            ["ti-building-bank","Bank details","Bank name, account number, IFSC — shown on invoice for payment"],
            ["ti-file-text","Invoice prefix & FY","e.g. INV/2025-26/0001 — auto-increments for you"],
          ].map(([ic,title,desc]) => `
            <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:12px;">
              <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
                <i class="ti ${ic}" aria-hidden="true" style="font-size:16px; color:var(--color-text-info);"></i>
                <span style="font-size:13px; font-weight:500;">${title}</span>
              </div>
              <span style="font-size:12px; color:var(--color-text-tertiary);">${desc}</span>
            </div>
          `).join("")}
        </div>
        <div style="background:var(--color-background-warning); border-radius:var(--border-radius-md); padding:10px 14px; font-size:13px; color:var(--color-text-warning); margin-top:12px;">
          <i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:14px; margin-right:4px;"></i>
          Your GSTIN must match your registered business. Incorrect GSTIN = invalid invoice under GST law.
        </div>
      </div>`
  },
  {
    title: "Customize your services",
    icon: "ti-list-check",
    content: `
      <div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:1.25rem;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
          <i class="ti ti-list-check" aria-hidden="true" style="font-size:20px; color:var(--color-text-info);"></i>
          <span style="font-size:16px; font-weight:500;">Step 3 — Customize your services catalog</span>
        </div>
        <p style="font-size:14px; color:var(--color-text-secondary); line-height:1.7; margin-bottom:14px;">
          Your chosen industry template pre-fills common services with correct SAC/HSN codes and GST rates. Review them and customize as needed.
        </p>
        <div style="border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); overflow:hidden;">
          <table style="width:100%; border-collapse:collapse; font-size:13px;">
            <thead><tr style="background:var(--color-background-secondary);">
              <th style="padding:8px 10px; text-align:left; font-size:11px; color:var(--color-text-secondary);">Service</th>
              <th style="padding:8px 10px; text-align:left; font-size:11px; color:var(--color-text-secondary);">SAC code</th>
              <th style="padding:8px 10px; text-align:right; font-size:11px; color:var(--color-text-secondary);">Rate</th>
              <th style="padding:8px 10px; text-align:center; font-size:11px; color:var(--color-text-secondary);">GST</th>
            </tr></thead>
            <tbody>
              ${[
                ["Gym Membership","999312","3,000","18%"],
                ["Personal Training","999312","800","18%"],
                ["Yoga Class","999312","500","18%"],
              ].map(([n,s,r,g]) => `
                <tr style="border-top:0.5px solid var(--color-border-tertiary);">
                  <td style="padding:8px 10px;">${n}</td>
                  <td style="padding:8px 10px; font-family:var(--font-mono); font-size:12px;">${s}</td>
                  <td style="padding:8px 10px; text-align:right;">&#8377;${r}</td>
                  <td style="padding:8px 10px; text-align:center;"><span style="background:var(--color-background-info); color:var(--color-text-info); padding:2px 8px; border-radius:4px; font-size:11px;">${g}</span></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
        <p style="font-size:13px; color:var(--color-text-secondary); margin-top:10px;">You can edit names, rates, GST %, add new services, or delete unused ones. These become your dropdown options when creating invoices.</p>
      </div>`
  },
  {
    title: "Add your clients",
    icon: "ti-users",
    content: `
      <div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:1.25rem;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
          <i class="ti ti-users" aria-hidden="true" style="font-size:20px; color:var(--color-text-info);"></i>
          <span style="font-size:16px; font-weight:500;">Step 4 — Add your clients</span>
        </div>
        <p style="font-size:14px; color:var(--color-text-secondary); line-height:1.7; margin-bottom:14px;">
          Go to the Clients tab and add each customer or member. Once added, you can select them from a dropdown when creating invoices.
        </p>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
          ${[
            ["Rahul Sharma","+91 99887 76655","Delhi","B2C (no GSTIN)"],
            ["ABC Fitness Pvt Ltd","+91 88776 55443","Maharashtra","B2B — GSTIN required"],
          ].map(([name,phone,state,type]) => `
            <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:12px;">
              <div style="font-size:14px; font-weight:500; margin-bottom:4px;">${name}</div>
              <div style="font-size:12px; color:var(--color-text-tertiary);">${phone}</div>
              <div style="font-size:12px; color:var(--color-text-tertiary);">${state}</div>
              <span style="font-size:11px; background:var(--color-background-info); color:var(--color-text-info); padding:2px 8px; border-radius:4px; margin-top:6px; display:inline-block;">${type}</span>
            </div>
          `).join("")}
        </div>
        <div style="background:var(--color-background-info); border-radius:var(--border-radius-md); padding:10px 14px; font-size:13px; color:var(--color-text-info);">
          <i class="ti ti-bulb" aria-hidden="true" style="font-size:14px; margin-right:4px;"></i>
          The client's state is crucial — if it differs from your business state, IGST applies instead of CGST+SGST. BillKaro handles this automatically.
        </div>
      </div>`
  },
  {
    title: "Create an invoice",
    icon: "ti-file-invoice",
    content: `
      <div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:1.25rem;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
          <i class="ti ti-file-invoice" aria-hidden="true" style="font-size:20px; color:var(--color-text-info);"></i>
          <span style="font-size:16px; font-weight:500;">Step 5 — Create an invoice</span>
        </div>
        <p style="font-size:14px; color:var(--color-text-secondary); line-height:1.7; margin-bottom:14px;">
          Click "New Invoice" from the navigation bar. Then follow these three sub-steps:
        </p>
        <div style="display:flex; flex-direction:column; gap:10px;">
          ${[
            ["1","Select client & dates","Pick the client from the dropdown. Set invoice date and due date. BillKaro auto-detects inter/intra-state.","ti-user-check"],
            ["2","Add line items","Pick services from your catalog dropdown. Set quantity and rate. GST is auto-applied. Add as many line items as needed.","ti-list-details"],
            ["3","Review & generate","Check the summary panel on the right — subtotal, CGST/SGST or IGST, and grand total. Click 'Generate Invoice' when ready.","ti-check"],
          ].map(([num,title,desc,ic]) => `
            <div style="display:flex; gap:12px; align-items:flex-start; background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:12px;">
              <div style="min-width:32px; height:32px; border-radius:50%; background:var(--color-background-info); color:var(--color-text-info); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500;">${num}</div>
              <div>
                <div style="font-size:13px; font-weight:500; margin-bottom:2px;">${title}</div>
                <div style="font-size:12px; color:var(--color-text-tertiary); line-height:1.6;">${desc}</div>
              </div>
            </div>
          `).join("")}
        </div>
      </div>`
  },
  {
    title: "Share via print or WhatsApp",
    icon: "ti-send",
    content: `
      <div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:1.25rem;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
          <i class="ti ti-send" aria-hidden="true" style="font-size:20px; color:var(--color-text-info);"></i>
          <span style="font-size:16px; font-weight:500;">Step 6 — Share the invoice</span>
        </div>
        <p style="font-size:14px; color:var(--color-text-secondary); line-height:1.7; margin-bottom:14px;">
          After generating, your invoice preview appears with two sharing options:
        </p>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:16px; text-align:center;">
            <i class="ti ti-printer" aria-hidden="true" style="font-size:24px; color:var(--color-text-secondary); display:block; margin-bottom:8px;"></i>
            <div style="font-size:14px; font-weight:500; margin-bottom:4px;">Print / Save PDF</div>
            <div style="font-size:12px; color:var(--color-text-tertiary); line-height:1.5;">Opens a print-ready page. Use your browser's "Save as PDF" option to get a downloadable file.</div>
          </div>
          <div style="background:#E8F8EE; border-radius:var(--border-radius-md); padding:16px; text-align:center;">
            <i class="ti ti-brand-whatsapp" aria-hidden="true" style="font-size:24px; color:#25D366; display:block; margin-bottom:8px;"></i>
            <div style="font-size:14px; font-weight:500; color:#085041; margin-bottom:4px;">Share on WhatsApp</div>
            <div style="font-size:12px; color:#0F6E56; line-height:1.5;">Opens WhatsApp with a pre-filled message containing invoice number, amount, and due date — sent directly to the client's phone.</div>
          </div>
        </div>
        <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:12px 14px; font-size:12px; color:var(--color-text-tertiary); margin-top:12px; line-height:1.6;">
          <i class="ti ti-info-circle" aria-hidden="true" style="font-size:14px; margin-right:4px; color:var(--color-text-secondary);"></i>
          The WhatsApp message includes: client name, invoice number, total amount, and due date. The client sees it as a regular WhatsApp message.
        </div>
      </div>`
  },
  {
    title: "Manage multiple businesses",
    icon: "ti-switch-horizontal",
    content: `
      <div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:1.25rem;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
          <i class="ti ti-switch-horizontal" aria-hidden="true" style="font-size:20px; color:var(--color-text-info);"></i>
          <span style="font-size:16px; font-weight:500;">Step 7 — Manage multiple businesses</span>
        </div>
        <p style="font-size:14px; color:var(--color-text-secondary); line-height:1.7; margin-bottom:14px;">
          Your friend has multiple gyms? Or runs a gym and a café? BillKaro supports unlimited businesses from a single account. Each has its own clients, invoices, services, and GSTIN.
        </p>
        <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;">
          ${[
            ["FitZone Gym — Noida","Gym & Fitness","09ABCDE1234F1Z5","12 invoices"],
            ["FitZone Gym — Dwarka","Gym & Fitness","07XYZAB5678G1H3","8 invoices"],
            ["Café Fuel — Noida","Restaurant & Café","09MNOPQ9012R1S4","5 invoices"],
          ].map(([name,type,gst,inv],i) => `
            <div style="display:flex; align-items:center; justify-content:space-between; background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:12px 14px; ${i===0?'border-left:3px solid var(--color-border-info); border-radius:0;':''}">
              <div>
                <div style="font-size:13px; font-weight:500;">${name} ${i===0?'<span style="font-size:10px; background:var(--color-background-info); color:var(--color-text-info); padding:2px 6px; border-radius:4px;">active</span>':''}</div>
                <div style="font-size:11px; color:var(--color-text-tertiary);">${type} — GSTIN: ${gst}</div>
              </div>
              <span style="font-size:12px; color:var(--color-text-secondary);">${inv}</span>
            </div>
          `).join("")}
        </div>
        <p style="font-size:13px; color:var(--color-text-secondary); line-height:1.6;">Use the dropdown in the top-right corner to switch between businesses. Click the <span style="font-family:var(--font-mono); font-size:12px;">+</span> button next to it to add a new one. Each business gets its own industry template.</p>
      </div>`
  },
];

let current = 0;

function render() {
  const stepper = document.getElementById("stepper");
  stepper.innerHTML = steps.map((s,i) => `
    <button onclick="goTo(${i})" style="display:flex;align-items:center;gap:4px;padding:6px 10px;font-size:12px;border-radius:var(--border-radius-md);cursor:pointer;
      background:${i===current?'var(--color-background-info)':'var(--color-background-secondary)'};
      color:${i===current?'var(--color-text-info)':'var(--color-text-secondary)'};
      border:0.5px solid ${i===current?'var(--color-border-info)':'var(--color-border-tertiary)'};
      font-weight:${i===current?'500':'400'};">
      <i class="ti ${s.icon}" aria-hidden="true" style="font-size:14px;"></i>${i+1}
    </button>
  `).join("");
  document.getElementById("step-content").innerHTML = steps[current].content;
  document.getElementById("prevBtn").disabled = current === 0;
  document.getElementById("prevBtn").style.opacity = current === 0 ? "0.4" : "1";
  document.getElementById("nextBtn").disabled = current === steps.length - 1;
  document.getElementById("nextBtn").style.opacity = current === steps.length - 1 ? "0.4" : "1";
}

function go(dir) { current = Math.max(0, Math.min(steps.length-1, current+dir)); render(); }
function goTo(i) { current = i; render(); }

render();
</script>
